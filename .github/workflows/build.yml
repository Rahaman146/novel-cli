name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses-dev libncursesw5-dev libcurl4-openssl-dev libcjson-dev cmake

      - name: Build with Make
        run: |
          make clean
          make

      - name: Build with CMake
        run: |
          cmake -B build-cmake
          cmake --build build-cmake

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: novel-cli-linux-x86_64
          path: novel-cli

  build-windows:
    name: Build Windows (MinGW-w64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            make
            mingw-w64-x86_64-make
            mingw-w64-x86_64-pdcurses
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-cjson
            zip

      - name: Build novel-cli.exe
        run: |
          make -f Makefile.win 2>&1 | tee build.log || true
          if [ ! -f novel-cli.exe ]; then
            echo "Make build failed, attempting direct gcc compilation..."
            gcc -Wall -Wextra -std=c11 -Isrc -DPDC_WIDE -DPDC_FORCE_UTF8 -I/mingw64/include/pdcurses src/*.c -o novel-cli.exe -lpdcurses_wincon -lcurl -lcjson -lws2_32 -lwinmm 2>&1 | tee -a build.log || true
          fi
          if [ ! -f novel-cli.exe ]; then
            echo "=== BUILD LOG ==="
            cat build.log
            while IFS= read -r line; do
              echo "::error::$line"
            done < build.log
            exit 1
          fi
          ls -la novel-cli.exe

      - name: Package Windows Release
        run: |
          mkdir -p release-win
          cp novel-cli.exe release-win/
          # Copy DLL dependencies automatically via ldd
          for dll in $(ldd novel-cli.exe | grep /mingw64 | awk '{print $3}'); do
            if [ -f "$dll" ]; then
              cp "$dll" release-win/ 2>/dev/null || true
            fi
          done
          # Copy explicit runtime DLLs as fallback
          cp /mingw64/bin/libpdcurses_wincon.dll release-win/ 2>/dev/null || true
          cp /mingw64/bin/libpdcurses.dll release-win/ 2>/dev/null || true
          cp /mingw64/bin/libcurl-4.dll release-win/ 2>/dev/null || true
          cp /mingw64/bin/libcjson.dll release-win/ 2>/dev/null || true
          cp /mingw64/bin/zlib1.dll release-win/ 2>/dev/null || true
          cp README.md release-win/
          cp LICENSE release-win/
          ls -la release-win/
          cd release-win && zip -r ../novel-cli-windows-x86_64.zip *

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: novel-cli-windows-x86_64
          path: novel-cli-windows-x86_64.zip

  release:
    name: Create GitHub Release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: novel-cli-linux-x86_64

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: novel-cli-windows-x86_64

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            novel-cli
            novel-cli-windows-x86_64.zip
          generate_release_notes: true
